name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# New pull-request and feature-branch pushes supersede obsolete checks.
# Runs on main and release tags always finish so each gets a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/') }}

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  lint:
    name: Lint & architecture rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # AGENTS.md is the shared instruction file for Claude Code and Codex. Claude
      # Code only sees it through this import, so fail if CLAUDE.md loses it.
      - name: CLAUDE.md imports AGENTS.md
        run: |
          grep -qx '@AGENTS.md' CLAUDE.md || {
            echo "::error file=CLAUDE.md::CLAUDE.md must contain a line with only @AGENTS.md. Put project rules in AGENTS.md."
            exit 1
          }
      # AGENTS.md: UI text, SVG and code use ASCII "-", never a Unicode minus,
      # en dash or em dash.
      - name: ASCII dashes only
        env:
          LC_ALL: C.UTF-8
        run: |
          if grep -rnP '[\x{2212}\x{2013}\x{2014}]' src e2e tools test public index.html \
            --include='*.ts' --include='*.tsx' --include='*.css' --include='*.svg' --include='*.html'; then
            echo "::error::Use ASCII '-' (AGENTS.md), not a Unicode minus, en dash or em dash."
            exit 1
          fi
      - uses: ./.github/actions/setup
      - name: Check release version and changelog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          # Feature branches add a changelog.d/ fragment and never touch the
          # version or CHANGELOG.md, so merged PRs cannot collide. Only a
          # release (pnpm release:prepare) bumps the version.
          pnpm check:fragments
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            git fetch --no-tags --depth=1 origin main
            BASE_SHA=origin/main
          fi
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if [ "$BASE_SHA" != "origin/main" ]; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
            fi
            pnpm check:version --base "$BASE_SHA"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
              pnpm check:fragments --base "$BASE_SHA"
            fi
          else
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
              echo "::error::PR and merge-queue release-note checks require a base commit."
              exit 1
            fi
            pnpm check:version
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            pnpm check:version --tag "$GITHUB_REF_NAME"
          fi
      # Formatting, lint, import order, and the AGENTS.md rules encoded in
      # biome.json: shared/client/worker import boundaries, no Math.random or
      # Date in shared/, no timers or non-hibernating sockets in worker/.
      # Findings are annotated on the pull request diff.
      - run: pnpm exec biome ci .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Regenerates worker-configuration.d.ts from wrangler.jsonc first, so
      # bindings and code cannot drift apart.
      - run: pnpm typecheck

  test:
    name: Unit & Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Engine tests and Worker/DO tests inside workerd. Vitest fails on
      # `.only` in CI and annotates failures on the diff.
      - run: pnpm test:version
      - run: pnpm test
      - run: pnpm sim -- --games 100

  build:
    name: Build, budgets & deploy dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Workers Builds runs `pnpm run build` (typecheck + vite build); the
      # typecheck half has its own job above.
      - run: pnpm exec vite build
      # Lobby JS budget from docs/TECH_STACK.md and Cloudflare asset and Worker
      # size limits; the table lands in the job summary.
      - run: pnpm check:bundle
      # Everything `wrangler deploy` does except the upload: validates the
      # generated config, bindings, migrations and assets. Needs no credentials.
      - run: pnpm exec wrangler deploy --dry-run

  # Pull requests that only edit Markdown skip the browser suite. Pushes to main,
  # merge queue runs and manual runs always run it.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      # Keeps the read-only token so the base revision can be fetched below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qv '\.md$'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: E2E (Playwright ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      # Split every scenario across isolated runners, one browser worker each.
      # fully-parallel enables test-level sharding, not extra workers per runner.
      # Live drand verification runs separately because it needs a public relay.
      - run: pnpm test:e2e --grep-invert @live --fully-parallel --workers 1 --shard ${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  cloudflare:
    name: Cloudflare config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Keeps the read-only token so the base revision can be fetched below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # DO migrations append-only against the base revision, SQLite-only
      # classes, every binding backed by a migration, and Previews never bound
      # to production D1/R2/KV.
      - name: Check wrangler.jsonc
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            pnpm check:wrangler --base "$BASE_SHA"
          else
            pnpm check:wrangler
          fi

  # The repo is public, so a secret in any commit is a leak even after a later
  # commit deletes it. Scan all history, not just the diff. This runs the gitleaks
  # CLI directly because gitleaks-action needs a paid license for organization repos.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # `git` scans every commit's diff. `dir` also scans the checked-out tree,
      # which catches content that only a merge commit introduced.
      - name: Scan history and working tree
        run: |
          gitleaks git --redact --verbose --no-banner .
          gitleaks dir --redact --verbose --no-banner .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Blocks pull requests that add a dependency (npm or GitHub Action) with
      # a known high or critical vulnerability. Only the diff counts, so a new
      # advisory on an existing package never turns an unrelated PR red.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

  # The single check to require in branch protection. It fails if any job above
  # failed or was cancelled (skipped jobs, like dependency review on pushes, are
  # fine). `verify` and `secrets` keep their earlier check names, so existing
  # required checks keep working.
  # Every commit must be authored by a person. An agent records itself with a
  # Co-Authored-By trailer instead, so the repository's contributor list stays
  # human and attribution is not split across a second account.
  authorship:
    name: Commit authorship
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject commits authored by an agent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          offenders=$(git log --format='%h %an <%ae> %cn <%ce>' "$BASE_SHA..$HEAD_SHA" |
            grep -Ei '<[^>]*@(anthropic|openai)[.]com>' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Commits must be authored by a person. Record the agent with a Co-Authored-By trailer instead."
            echo "$offenders"
            exit 1
          fi
          echo "Every commit author and committer is a person."

  verify:
    if: always()
    needs:
      - lint
      - typecheck
      - test
      - build
      - changes
      - e2e
      - cloudflare
      - secrets
      - dependency-review
      - authorship
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          exit 1
      - run: echo "All CI jobs passed."
