name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # AGENTS.md is the shared instruction file for Claude Code and Codex. Claude
      # Code only sees it through this import, so fail if CLAUDE.md loses it.
      - name: CLAUDE.md imports AGENTS.md
        run: |
          grep -qx '@AGENTS.md' CLAUDE.md || {
            echo "::error file=CLAUDE.md::CLAUDE.md must contain a line with only @AGENTS.md. Put project rules in AGENTS.md."
            exit 1
          }
      # pnpm version comes from `packageManager` in package.json and Node from
      # .node-version, the same pins Workers Builds uses for deploys.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # The repo is public, so a secret in any commit is a leak even after a later
  # commit deletes it. Scan all history, not just the diff. This runs the gitleaks
  # CLI directly because gitleaks-action needs a paid license for organization repos.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # `git` scans every commit's diff. `dir` also scans the checked-out tree,
      # which catches content that only a merge commit introduced.
      - name: Scan history and working tree
        run: |
          gitleaks git --redact --verbose --no-banner .
          gitleaks dir --redact --verbose --no-banner .
