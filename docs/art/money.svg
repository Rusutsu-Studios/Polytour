<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <g id="coin"><ellipse cx="0" cy="3" rx="14" ry="6" fill="#c9952a"/><ellipse cx="0" cy="0" rx="14" ry="6" fill="#ffc83d"/><path d="M0 -3 l1.5 2.5 h3 l-2.4 1.8 l1 3 l-3.1 -1.8 l-3.1 1.8 l1 -3 l-2.4 -1.8 h3 z" fill="#e2a523"/></g>
    <g id="note"><path d="M-30 -12 h60 l-6 24 h-60 z" fill="#5fa86a"/><path d="M-26 -9 h52 l-4.6 18 h-52 z" fill="none" stroke="#fffaf0" stroke-width="2"/><ellipse cx="-3" cy="0" rx="7" ry="5" fill="#fffaf0" opacity=".7"/></g>
    <g id="bundle"><path d="M-30 -2 h60 l-6 24 h-60 z" fill="#47895a"/><path d="M-30 -8 h60 l-6 24 h-60 z" fill="#52975f"/><path d="M-30 -14 h60 l-6 24 h-60 z" fill="#5fa86a"/><path d="M-26 -11 h52 l-4.6 18 h-52 z" fill="none" stroke="#fffaf0" stroke-width="2"/><path d="M-6 -14 h12 l-6 36 h-12 z" fill="currentColor"/></g>
    <g id="silver"><path d="M-26 0 h52 l-8 -16 h-36 z" fill="#e6edf1"/><path d="M-26 0 h52 v8 h-52 z" fill="#aab7bf"/><path d="M-18 -16 h36 l8 16 h-10 l-6 -12 h-26 z" fill="#f4f8fa" opacity=".8"/><path d="M0 -11 l1.5 2.5 h3 l-2.4 1.8 l1 3 l-3.1 -1.8 l-3.1 1.8 l1 -3 l-2.4 -1.8 h3 z" fill="#9aa8b0"/></g>
    <g id="gold"><path d="M-32 0 h64 l-10 -20 h-44 z" fill="#ffd767"/><path d="M-32 0 h64 v10 h-64 z" fill="#d79e22"/><path d="M-22 -20 h44 l10 20 h-12 l-8 -15 h-32 z" fill="#fff0b3" opacity=".7"/><path d="M0 -14 l2 3.2 h4 l-3 2.3 l1.2 3.8 l-4.2 -2.4 l-4.2 2.4 l1.2 -3.8 l-3 -2.3 h4 z" fill="#d79e22"/></g>
    <g id="tray"><rect x="-200" y="-10" width="400" height="150" rx="16" fill="#b98353"/><rect x="-190" y="-2" width="380" height="132" rx="12" fill="#d7a678"/><rect x="-190" y="-2" width="380" height="10" rx="5" fill="#000" opacity=".08"/></g>
  </defs>
  <rect width="960" height="600" fill="#fffaf0"/>
  <text x="32" y="44" font-size="24" font-weight="700" fill="#173b45">Money pieces and the pocket-money tray (#59)</text>
  <text x="32" y="68" font-size="13" fill="#47666c">Illustration only, capped; the HUD shows the exact amount. Bundle straps use the owner colour (Coral here).</text>

  <g transform="translate(0 130)" color="#be3d24" font-size="13" text-anchor="middle">
    <g transform="translate(110 0)"><use href="#coin"/></g><text x="110" y="44" font-weight="700" fill="#173b45">Coin · 1 k</text>
    <g transform="translate(290 0)"><use href="#note"/></g><text x="290" y="44" font-weight="700" fill="#173b45">Note · 5 k</text>
    <g transform="translate(470 0)"><use href="#bundle"/></g><text x="470" y="44" font-weight="700" fill="#173b45">Bundle · 50 k</text>
    <g transform="translate(650 0)"><use href="#silver"/></g><text x="650" y="44" font-weight="700" fill="#173b45">Silver bar · 100 k</text>
    <g transform="translate(830 0)"><use href="#gold"/></g><text x="830" y="44" font-weight="700" fill="#173b45">Gold bar · 500 k</text>
  </g>

  <text x="32" y="232" font-size="15" font-weight="700" fill="#173b45">Tray layout: gold at the back, then silver, bundles, notes, coins at the front</text>
  <g color="#be3d24">
    <!-- 120 k: 2 bundles, 4 notes, 3 coins -->
    <g transform="translate(0 0)">
      <svg x="0" y="260" width="320" height="200" viewBox="-225 -60 450 220" overflow="visible">
        <use href="#tray"/>
        <use href="#bundle" x="-40" y="70"/><use href="#bundle" x="40" y="70"/>
        <use href="#note" x="-120" y="110"/><use href="#note" x="-112" y="104"/><use href="#note" x="-104" y="98"/><use href="#note" x="-96" y="92"/>
        <use href="#coin" x="110" y="112"/><use href="#coin" x="110" y="104"/><use href="#coin" x="140" y="114"/>
      </svg>
      <text x="160" y="452" font-size="14" font-weight="700" fill="#173b45" text-anchor="middle">120 k</text>
      <text x="160" y="470" font-size="12" fill="#47666c" text-anchor="middle">2 bundles · 4 notes · 3 coins</text>
    </g>
    <!-- 2 000 k: 3 gold, 4 silver, 2 bundles, 3 coins -->
    <g>
      <svg x="320" y="260" width="320" height="200" viewBox="-225 -60 450 220" overflow="visible">
        <use href="#tray"/>
        <use href="#gold" x="-80" y="30"/><use href="#gold" x="0" y="30"/><use href="#gold" x="-40" y="16"/>
        <use href="#silver" x="40" y="66"/><use href="#silver" x="100" y="66"/><use href="#silver" x="70" y="54"/><use href="#silver" x="150" y="66"/>
        <use href="#bundle" x="-130" y="76"/><use href="#bundle" x="-60" y="80"/>
        <use href="#coin" x="110" y="112"/><use href="#coin" x="110" y="104"/><use href="#coin" x="140" y="114"/>
      </svg>
      <text x="480" y="452" font-size="14" font-weight="700" fill="#173b45" text-anchor="middle">2,000 k (start)</text>
      <text x="480" y="470" font-size="12" fill="#47666c" text-anchor="middle">3 gold · 4 silver · 2 bundles · 3 coins</text>
    </g>
    <!-- 8 000 k: 12 gold (capped) + crown, 4 silver, 2 bundles, 3 coins -->
    <g>
      <svg x="640" y="260" width="320" height="200" viewBox="-225 -60 450 220" overflow="visible">
        <use href="#tray"/>
        <use href="#gold" x="-150" y="30"/><use href="#gold" x="-80" y="30"/><use href="#gold" x="-10" y="30"/><use href="#gold" x="60" y="30"/>
        <use href="#gold" x="-115" y="16"/><use href="#gold" x="-45" y="16"/><use href="#gold" x="25" y="16"/><use href="#gold" x="95" y="16"/>
        <use href="#gold" x="-80" y="2"/><use href="#gold" x="-10" y="2"/><use href="#gold" x="60" y="2"/><use href="#gold" x="-45" y="-12"/>
        <path d="M130 -6 l8 -22 l12 14 l10 -20 l10 20 l12 -14 l8 22 z" fill="#ffc83d" stroke="#d79e22" stroke-width="2"/>
        <use href="#silver" x="40" y="74"/><use href="#silver" x="100" y="74"/><use href="#silver" x="70" y="62"/><use href="#silver" x="150" y="74"/>
        <use href="#bundle" x="-130" y="80"/><use href="#bundle" x="-60" y="84"/>
        <use href="#coin" x="110" y="116"/><use href="#coin" x="110" y="108"/><use href="#coin" x="140" y="118"/>
      </svg>
      <text x="800" y="452" font-size="14" font-weight="700" fill="#173b45" text-anchor="middle">8,000 k</text>
      <text x="800" y="470" font-size="12" fill="#47666c" text-anchor="middle">12 gold (cap) + crown · 4 silver · 2 bundles · 3 coins</text>
    </g>
  </g>
  <text x="32" y="548" font-size="13" fill="#47666c">Rule: greedy split, then break one gold into 5 silver while silver &lt; 2, one silver into 2 bundles while bundles &lt; 2; at least 3 coins.</text>
  <text x="32" y="568" font-size="13" fill="#47666c">Caps: 12 gold, 6 silver, 6 bundles, 6 notes, 8 coins. One InstancedMesh per piece type.</text>
</svg>
