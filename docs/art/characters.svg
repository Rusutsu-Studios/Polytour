<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <!-- Shared face: eyes with highlight, blush, smile. Centre at 0,0, head radius 62. -->
    <g id="face">
      <ellipse cx="-22" cy="4" rx="8" ry="11" fill="#173b45"/><ellipse cx="22" cy="4" rx="8" ry="11" fill="#173b45"/>
      <circle cx="-19" cy="-1" r="3" fill="#fff"/><circle cx="25" cy="-1" r="3" fill="#fff"/>
      <ellipse cx="-36" cy="22" rx="9" ry="5" fill="#ef7f6a" opacity=".55"/><ellipse cx="36" cy="22" rx="9" ry="5" fill="#ef7f6a" opacity=".55"/>
      <path d="M-9 24 q9 9 18 0" stroke="#944f35" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Base disc and body; colour from the enclosing group via currentColor. -->
    <g id="body">
      <ellipse cx="0" cy="182" rx="74" ry="20" fill="#000" opacity=".12"/>
      <ellipse cx="0" cy="170" rx="70" ry="22" fill="currentColor"/>
      <ellipse cx="0" cy="162" rx="56" ry="15" fill="#fffaf0"/>
      <rect x="-30" y="128" width="24" height="34" rx="10" fill="#294758"/><rect x="6" y="128" width="24" height="34" rx="10" fill="#294758"/>
      <rect x="-46" y="62" width="92" height="80" rx="34" fill="currentColor"/>
      <rect x="-46" y="62" width="30" height="80" rx="15" fill="#000" opacity=".14"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#fffaf0"/>
  <text x="32" y="44" font-size="24" font-weight="700" fill="#173b45">Pawn characters (front view)</text>
  <text x="32" y="68" font-size="13" fill="#47666c">Chibi, about 2.3 heads tall, same height and footprint as today's pawn. Player colour on body and base; silhouette cue on the hat.</text>

  <!-- Tourist, seat 0 -->
  <g transform="translate(120 230)" color="#be3d24">
    <rect x="34" y="70" width="26" height="54" rx="10" fill="#8a5a3c"/>
    <use href="#body"/>
    <path d="M-30 66 L18 128" stroke="#173b45" stroke-width="5"/><rect x="6" y="112" width="30" height="22" rx="5" fill="#173b45"/><circle cx="21" cy="123" r="6" fill="#56b4d8"/>
    <rect x="-66" y="78" width="22" height="44" rx="11" fill="currentColor"/><circle cx="-55" cy="128" r="11" fill="#f7c88b"/>
    <rect x="44" y="78" width="22" height="44" rx="11" fill="currentColor"/><circle cx="55" cy="128" r="11" fill="#f7c88b"/>
    <circle cx="0" cy="0" r="62" fill="#f7c88b"/><use href="#face"/>
    <ellipse cx="0" cy="-40" rx="96" ry="20" fill="#f3dca4"/><ellipse cx="0" cy="-36" rx="96" ry="14" fill="#000" opacity=".08"/>
    <path d="M-50 -42 q50 -62 100 0 z" fill="#f3dca4"/><rect x="-50" y="-52" width="100" height="12" fill="currentColor"/>
  </g>
  <!-- Pilot, seat 1 -->
  <g transform="translate(360 230)" color="#236cce">
    <use href="#body"/>
    <path d="M-36 66 q36 22 72 0 l6 14 q-42 24 -84 0 z" fill="#fffaf0"/><path d="M30 76 q40 6 54 30 l-14 6 q-14 -18 -40 -22 z" fill="#fffaf0"/>
    <rect x="-66" y="78" width="22" height="44" rx="11" fill="currentColor"/><circle cx="-55" cy="128" r="11" fill="#e0a26e"/>
    <rect x="44" y="78" width="22" height="44" rx="11" fill="currentColor"/><circle cx="55" cy="128" r="11" fill="#e0a26e"/>
    <circle cx="0" cy="0" r="62" fill="#e0a26e"/><use href="#face"/>
    <path d="M-64 -16 q0 -66 64 -66 q64 0 64 66 z" fill="#8a5a3c"/><rect x="-70" y="-22" width="140" height="12" rx="6" fill="#6d4429"/>
    <g transform="translate(0 -46)"><rect x="-50" y="-4" width="100" height="10" fill="#294758"/><circle cx="-22" cy="0" r="17" fill="#294758"/><circle cx="22" cy="0" r="17" fill="#294758"/><circle cx="-22" cy="0" r="11" fill="#9fdcef"/><circle cx="22" cy="0" r="11" fill="#9fdcef"/><circle cx="-26" cy="-4" r="3" fill="#fff"/><circle cx="18" cy="-4" r="3" fill="#fff"/></g>
  </g>
  <!-- Artist, seat 2 -->
  <g transform="translate(600 230)" color="#8151b5">
    <use href="#body"/>
    <rect x="-66" y="78" width="22" height="44" rx="11" fill="currentColor"/><circle cx="-55" cy="128" r="11" fill="#b97a4f"/>
    <rect x="44" y="70" width="22" height="44" rx="11" fill="currentColor" transform="rotate(-20 55 92)"/>
    <ellipse cx="80" cy="112" rx="30" ry="20" fill="#f3dca4"/><circle cx="70" cy="104" r="5" fill="#e2574a"/><circle cx="84" cy="100" r="5" fill="#ffc83d"/><circle cx="96" cy="110" r="5" fill="#56b4d8"/><circle cx="78" cy="120" r="5" fill="#26764c"/><circle cx="64" cy="118" r="6" fill="#b97a4f"/>
    <circle cx="0" cy="0" r="62" fill="#b97a4f"/><use href="#face"/>
    <path d="M-66 -26 q30 -60 120 -40 q20 10 -4 30 z" fill="#5d3d84"/><rect x="18" y="-92" width="8" height="22" rx="4" fill="#5d3d84" transform="rotate(14 22 -80)"/>
  </g>
  <!-- Explorer, seat 3 -->
  <g transform="translate(840 230)" color="#26764c">
    <use href="#body"/>
    <rect x="-46" y="96" width="92" height="12" fill="#8a5a3c"/>
    <path d="M-20 70 L-20 90 M20 70 L20 90" stroke="#294758" stroke-width="4"/><rect x="-28" y="86" width="22" height="20" rx="6" fill="#294758"/><rect x="6" y="86" width="22" height="20" rx="6" fill="#294758"/>
    <rect x="-66" y="78" width="22" height="44" rx="11" fill="currentColor"/><circle cx="-55" cy="128" r="11" fill="#7a4a2e"/>
    <rect x="44" y="78" width="22" height="44" rx="11" fill="currentColor"/><circle cx="55" cy="128" r="11" fill="#7a4a2e"/>
    <rect x="58" y="64" width="16" height="72" rx="8" fill="#f3dca4" transform="rotate(18 66 100)"/>
    <circle cx="0" cy="0" r="62" fill="#7a4a2e"/><use href="#face"/>
    <ellipse cx="0" cy="-36" rx="86" ry="16" fill="#d9c08a"/><path d="M-48 -38 l8 -40 h80 l8 40 z" fill="#d9c08a"/><rect x="-46" y="-50" width="92" height="12" fill="currentColor"/>
  </g>

  <g font-size="14" text-anchor="middle">
    <text x="120" y="456" font-weight="700" fill="#be3d24">The Tourist</text><text x="120" y="474" fill="#47666c">Coral · wide sun hat, camera</text>
    <text x="360" y="456" font-weight="700" fill="#236cce">The Pilot</text><text x="360" y="474" fill="#47666c">Ocean · cap, goggles, scarf</text>
    <text x="600" y="456" font-weight="700" fill="#8151b5">The Artist</text><text x="600" y="474" fill="#47666c">Lavender · tall beret, palette</text>
    <text x="840" y="456" font-weight="700" fill="#26764c">The Explorer</text><text x="840" y="474" fill="#47666c">Forest · safari hat, map, binoculars</text>
  </g>

  <text x="32" y="520" font-size="15" font-weight="700" fill="#173b45">Expressions (face atlas frames, swapped by the Director)</text>
  <g transform="translate(0 580)" font-size="12" text-anchor="middle" fill="#47666c">
    <g transform="translate(90 0) scale(.5)"><circle r="62" fill="#f7c88b"/><use href="#face"/></g><text x="90" y="50">Idle</text>
    <g transform="translate(220 0) scale(.5)"><circle r="62" fill="#f7c88b"/><path d="M-32 6 q10 -14 20 0 M12 6 q10 -14 20 0" stroke="#173b45" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M-14 20 q14 20 28 0 z" fill="#944f35"/></g><text x="220" y="50">Happy (buy, upgrade)</text>
    <g transform="translate(370 0) scale(.5)"><circle r="62" fill="#f7c88b"/><ellipse cx="-22" cy="6" rx="8" ry="9" fill="#173b45"/><ellipse cx="22" cy="6" rx="8" ry="9" fill="#173b45"/><path d="M-34 -10 l20 6 M34 -10 l-20 6" stroke="#173b45" stroke-width="5" stroke-linecap="round"/><path d="M-10 32 q10 -9 20 0" stroke="#944f35" stroke-width="4" fill="none" stroke-linecap="round"/></g><text x="370" y="50">Sad (big rent)</text>
    <g transform="translate(520 0) scale(.5)"><circle r="62" fill="#f7c88b"/><path d="M-22 4 m-10 0 a10 10 0 1 1 10 10 a6 6 0 1 1 -6 -6 M22 4 m-10 0 a10 10 0 1 1 10 10 a6 6 0 1 1 -6 -6" stroke="#173b45" stroke-width="4" fill="none"/><ellipse cx="0" cy="30" rx="7" ry="5" fill="#944f35"/></g><text x="520" y="50">Dizzy (island)</text>
    <g transform="translate(670 0) scale(.5)"><circle r="62" fill="#c9c1b6"/><path d="M-30 -6 l16 16 M-14 -6 l-16 16 M14 -6 l16 16 M30 -6 l-16 16" stroke="#173b45" stroke-width="5" stroke-linecap="round"/><path d="M-10 32 h20" stroke="#944f35" stroke-width="4" stroke-linecap="round"/></g><text x="670" y="50">Bankrupt (greyed)</text>
    <g transform="translate(820 0) scale(.5)"><circle r="62" fill="#f7c88b"/><path d="M-32 6 q10 -14 20 0 M12 6 q10 -14 20 0" stroke="#173b45" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M-22 18 q22 34 44 0 z" fill="#944f35"/><path d="M-60 -60 l8 14 M60 -60 l-8 14 M0 -80 v14" stroke="#ffc83d" stroke-width="6" stroke-linecap="round"/></g><text x="820" y="50">Victory</text>
  </g>
</svg>
