<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <!-- Cottage: ivory walls, roof in the owner colour (currentColor). Origin at ground centre. -->
    <g id="cottage">
      <rect x="-26" y="-40" width="52" height="40" rx="4" fill="#fbf6ec" stroke="#173b45" stroke-opacity=".25" stroke-width="2"/>
      <rect x="-26" y="-40" width="14" height="40" fill="#000" opacity=".07"/>
      <path d="M-34 -36 L0 -70 L34 -36 z" fill="currentColor"/><path d="M-34 -36 L0 -70 L-6 -36 z" fill="#000" opacity=".15"/>
      <rect x="12" y="-72" width="9" height="22" fill="#b97a4f"/>
      <rect x="-6" y="-22" width="12" height="22" rx="5" fill="#8a5a3c"/>
      <rect x="-20" y="-32" width="10" height="10" rx="2" fill="#56b4d8"/><rect x="10" y="-32" width="10" height="10" rx="2" fill="#56b4d8"/>
    </g>
    <!-- Owner plinth and pennant for a hotel monument. -->
    <g id="plinth">
      <ellipse cx="0" cy="8" rx="64" ry="10" fill="#000" opacity=".12"/>
      <rect x="-58" y="-12" width="116" height="18" rx="6" fill="currentColor"/>
      <rect x="-58" y="-12" width="116" height="6" rx="3" fill="#fff" opacity=".25"/>
    </g>
    <g id="pennant">
      <rect x="0" y="-26" width="3" height="28" fill="#173b45"/><path d="M3 -26 l22 7 l-22 7 z" fill="currentColor"/>
    </g>
  </defs>
  <rect width="960" height="760" fill="#fffaf0"/>
  <text x="32" y="44" font-size="24" font-weight="700" fill="#173b45">Buildings: houses, city monuments, resort bungalows</text>
  <text x="32" y="68" font-size="13" fill="#47666c">Owner colour on roofs, plinths, pennants and awnings. Monuments keep their own stone colours so the city stays recognisable.</text>

  <!-- Houses -->
  <text x="32" y="108" font-size="15" font-weight="700" fill="#173b45">Houses (levels 1–3), shown for Ocean</text>
  <g color="#236cce">
    <g transform="translate(110 230)"><use href="#cottage"/></g>
    <g transform="translate(300 230)"><use href="#cottage" transform="translate(-24 0)"/><g transform="translate(30 0) scale(.75 1.15)"><use href="#cottage"/></g></g>
    <g transform="translate(520 230)"><use href="#cottage" transform="translate(-58 0) scale(.9)"/><g transform="translate(0 0) scale(.8 1.2)"><use href="#cottage"/></g><use href="#cottage" transform="translate(58 0) scale(.9)"/></g>
    <g transform="translate(780 230)"><use href="#plinth"/>
      <rect x="-30" y="-120" width="60" height="108" rx="6" fill="#fbf6ec" stroke="#173b45" stroke-opacity=".25" stroke-width="2"/>
      <g fill="#56b4d8"><rect x="-20" y="-108" width="12" height="10" rx="2"/><rect x="-4" y="-108" width="12" height="10" rx="2"/><rect x="12" y="-108" width="8" height="10" rx="2"/><rect x="-20" y="-88" width="12" height="10" rx="2"/><rect x="-4" y="-88" width="12" height="10" rx="2"/><rect x="12" y="-88" width="8" height="10" rx="2"/><rect x="-20" y="-68" width="12" height="10" rx="2"/><rect x="-4" y="-68" width="12" height="10" rx="2"/><rect x="12" y="-68" width="8" height="10" rx="2"/><rect x="-20" y="-48" width="12" height="10" rx="2"/><rect x="-4" y="-48" width="12" height="10" rx="2"/><rect x="12" y="-48" width="8" height="10" rx="2"/></g>
      <rect x="-36" y="-128" width="72" height="10" rx="4" fill="currentColor"/><use href="#pennant" transform="translate(-2 -128)"/>
    </g>
  </g>
  <g font-size="12" text-anchor="middle" fill="#47666c"><text x="110" y="262">1 house</text><text x="300" y="262">2 houses</text><text x="520" y="262">3 houses</text><text x="780" y="262">Generic hotel (fallback)</text></g>

