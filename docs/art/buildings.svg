    <rect x="-44" y="-26" width="84" height="8" rx="3" fill="currentColor"/>
    <rect x="-30" y="-56" width="56" height="30" fill="#e8c890"/><rect x="-6" y="-48" width="12" height="22" fill="#8a5a3c"/>
    <path d="M-46 -54 L-2 -92 L42 -54 z" fill="#c9a25a"/><path d="M-46 -54 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6" fill="#c9a25a"/>
